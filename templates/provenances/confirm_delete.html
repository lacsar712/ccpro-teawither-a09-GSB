{% extends "base.html" %}
{% block title %}删除溯源条{% endblock %}
{% block content %}
<div class="page-header">
  <h1>删除茶青溯源条</h1>
</div>
<div class="card">
  <p>确认删除溯源条「{{ object }}」？</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">确认删除</button>
    <a class="btn btn-secondary" href="{% url 'provenance_list' %}">取消</a>
  </form>
</div>
{% endblock %}
