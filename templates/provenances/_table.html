<p class="muted" style="margin-top:0">共 {{ provenances|length }} 条</p>
{% if provenances %}
<table class="data">
  <thead>
    <tr>
      <th>所属茶园</th>
      <th>关联批次</th>
      <th>鲜叶村组</th>
      <th>采摘日</th>
      <th>登记人</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    {% for p in provenances %}
    <tr>
      <td>{{ p.garden.name }}</td>
      <td>{{ p.batch }}</td>
      <td>{{ p.villageGroup }}</td>
      <td>{{ p.pickedOn|date:"Y-m-d" }}</td>
      <td>{{ p.registrar }}</td>
      <td class="actions">
        <a class="btn btn-sm btn-secondary" href="{% url 'provenance_edit' p.pk %}">编辑</a>
        <a class="btn btn-sm btn-danger" href="{% url 'provenance_delete' p.pk %}">删除</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty">暂无茶青溯源条。</p>
{% endif %}
